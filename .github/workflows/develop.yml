name: Development

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

defaults:
  run:
    working-directory: ./satallite

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: satallite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: satallite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t ghcr.io/thejudyessam/satellite-api:latest .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/thejudyessam/satellite-api:latest

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: SSH into EC2 instance
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY}}
          port: 22
          script: |
            docker pull ghcr.io/thejudyessam/satellite-api:latest

            if docker ps -a --format '{{.Names}}' | grep -q '^satellite-api$'; then
            docker stop satellite-api
            docker rm satellite-api
            fi

            docker run -d --name satellite-api -p 3000:3000 ghcr.io/thejudyessam/satellite-api:latest
